[project]
name = "autofbpost"
version = "0.4.1"
description = "Automate facebook posts - TUI"
requires-python = ">=3.13"
dependencies = [
    "copykitten>=2.1.0",
    "fsspec>=2026.9.0",
    "httpx>=0.28.1",
    "nuitka>=4.3.5",
    "packaging>=26.3",
    "platformdirs>=4.0",
    "playwright>=1.65.2",
    "py-machineid>=1.0.0",
    "rtoml>=0.14.0",
    "ruff>=0.17.6",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "textual-dev>=1.8.0",
]
